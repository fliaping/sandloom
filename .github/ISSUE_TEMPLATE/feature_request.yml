name: Feature request
description: Propose a scoped improvement or adapter
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem, independent of a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary extension boundary
      options:
        - Execution backend
        - Metadata store
        - Worker registry
        - Object store
        - Isolation policy
        - Control API or MCP
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note new privileges, trust assumptions, migration needs, or failure modes.
    validations:
      required: true
