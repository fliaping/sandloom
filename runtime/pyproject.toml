[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandloom-runtime"
version = "0.2.0"
description = "Reusable Bubblewrap runtime with automatic isolation negotiation"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
